<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | Butterfly Diaries
    {% else %}
      Butterfly Diaries | Field notes and photographs
    {% endif %}
  </title>

  <meta name="description"
        content="{{ page.description | default: site.description | escape }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <header class="site-header">
    <div class="site-header-inner">
      <p class="site-tagline">Field notes, photographs and encounters</p>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Journal</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/species/' | relative_url }}">Species</a>
        <a href="{{ '/places/' | relative_url }}">Places</a>
        <a href="{{ '/gallery/' | relative_url }}">Gallery</a>
        <a href="{{ '/map/' | relative_url }}">Map</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Butterfly Diaries · Field notes and photographs</p>
  </footer>
</body>
</html>
