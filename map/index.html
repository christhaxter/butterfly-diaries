<h1 class="page-title">Explore the map</h1>

<p>
  Explore the landscape using satellite imagery or a street map.
  More map layers and butterfly records will be added here.
</p>

<div id="butterfly-map" style="height: 800px; width: 100%;"></div>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script>
  
  const butterflyMap = L.map("butterfly-map").setView(
    [54.5, -3.0],
    5
  );
  
  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
    }
  );
  
  const roadsOverlay = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Esri, HERE, Garmin, OpenStreetMap contributors"
    }
  );
  
  const placesOverlay = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Sources: Esri, Garmin, HERE, OpenStreetMap contributors, and the GIS user community"
    }
  );
  
  const streets = L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }
  );
  
  // Start with satellite imagery, roads and place names.
  satellite.addTo(butterflyMap);
  roadsOverlay.addTo(butterflyMap);
  placesOverlay.addTo(butterflyMap);
  
  // Basemaps and independently selectable overlays.
  L.control.layers(
    {
      "Satellite imagery": satellite,
      "Street map": streets
    },
    {
      "Roads": roadsOverlay,
      "Place names and boundaries": placesOverlay
    },
    {
      collapsed: false
    }
  ).addTo(butterflyMap);
  
  // Metric scale bar.
  L.control.scale({
    imperial: false
  }).addTo(butterflyMap);

</script>
