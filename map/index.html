title: Map
permalink: /map/

<h1 class="page-title">Explore the map</h1>

<p>
  Explore the sites visited! The location markers on the map show the places I have
  visited in search of butterflies. Click on the markers to discover more.
</p>

<div id="butterfly-map"></div>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script>
  const butterflyMap = L.map("butterfly-map", {
    zoomControl: false
  }).setView(
    [54.5, -3.0],
    5
  );

  // Satellite imagery (Esri)
  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS user community"
    }
  );

  // Roads and transport features (Esri)
  const roadsOverlay = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Esri, HERE, Garmin, OpenStreetMap contributors"
    }
  );

  // Place names and boundaries (Esri)
  const placesOverlay = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Sources: Esri, Garmin, HERE, OpenStreetMap contributors, and the GIS user community"
    }
  );

  // OpenStreetMap street map
  const streets = L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }
  );

  // Default: satellite imagery with roads and place names.
  satellite.addTo(butterflyMap);
  roadsOverlay.addTo(butterflyMap);
  placesOverlay.addTo(butterflyMap);

  // Layer selector
  L.control.layers(
    {
      "Satellite imagery (Esri)": satellite,
      "Street map (OpenStreetMap)": streets
    },
    {
      "Roads (Esri)": roadsOverlay,
      "Place names and boundaries (Esri)": placesOverlay
    },
    {
      collapsed: true
    }
  ).addTo(butterflyMap);

  // Remember which Esri overlays the user wants enabled.
  let roadsEnabled = true;
  let placesEnabled = true;

  // Track manual overlay changes.
  butterflyMap.on("overlayadd", function (event) {
    if (event.layer === roadsOverlay) roadsEnabled = true;
    if (event.layer === placesOverlay) placesEnabled = true;
  });

  butterflyMap.on("overlayremove", function (event) {
    if (event.layer === roadsOverlay) roadsEnabled = false;
    if (event.layer === placesOverlay) placesEnabled = false;
  });

  // Switching to OpenStreetMap removes the Esri overlays.
  butterflyMap.on("baselayerchange", function (event) {
    if (event.layer === streets) {
      butterflyMap.removeLayer(roadsOverlay);
      butterflyMap.removeLayer(placesOverlay);
    }

    // Switching back to satellite restores the selected overlays.
    if (event.layer === satellite) {
      if (roadsEnabled) roadsOverlay.addTo(butterflyMap);
      if (placesEnabled) placesOverlay.addTo(butterflyMap);
    }
  });

  // Metric scale bar
  L.control.scale({
    imperial: false
  }).addTo(butterflyMap);

  // Full-screen map toggle
  const FullscreenControl = L.Control.extend({
    options: {
      position: "bottomright"
    },

    onAdd: function (map) {
      const container = L.DomUtil.create(
        "div",
        "leaflet-bar leaflet-control"
      );

      const button = L.DomUtil.create("a", "", container);
      button.href = "#";
      button.title = "Expand map";
      button.setAttribute("role", "button");
      button.setAttribute("aria-label", "Expand map");
      button.style.width = "44px";
      button.style.height = "44px";
      button.style.lineHeight = "44px";
      button.style.fontSize = "24px";
      button.style.textAlign = "center";
      button.style.fontWeight = "bold";
      button.textContent = "⛶";

      L.DomEvent.disableClickPropagation(container);

      function toggleFullscreen(event) {
        L.DomEvent.preventDefault(event);

        const mapElement = document.getElementById("butterfly-map");
        const isFullscreen =
          mapElement.classList.contains("map-fullscreen");

        if (isFullscreen) {
          mapElement.classList.remove("map-fullscreen");
          document.body.style.overflow = "";
          button.textContent = "⛶";
          button.title = "Expand map";
          button.setAttribute("aria-label", "Expand map");
        } else {
          mapElement.classList.add("map-fullscreen");
          document.body.style.overflow = "hidden";
          button.textContent = "×";
          button.title = "Return to page";
          button.setAttribute("aria-label", "Return to page");
        }

        setTimeout(function () {
          map.invalidateSize();
        }, 150);
      }

      L.DomEvent.on(button, "click", toggleFullscreen);

      return container;
    }
  });

  butterflyMap.addControl(new FullscreenControl());

  // Show coordinates under the mouse cursor
  const coordinatesControl = L.control({
    position: "topleft"
  });

  coordinatesControl.onAdd = function () {
    this.container = L.DomUtil.create(
      "div",
      "map-coordinates"
    );

    this.container.textContent = "Lat: —, Lon: —";
    return this.container;
  };

  coordinatesControl.addTo(butterflyMap);

  butterflyMap.on("mousemove", function (event) {
    const lat = event.latlng.lat.toFixed(5);
    const lon = event.latlng.lng.toFixed(5);

    coordinatesControl.getContainer().textContent =
      "Lat: " + lat + ", Lon: " + lon;
  });

  // Journal posts, including site-specific species and images
  const posts = [
    {% for post in site.posts %}
    {
      title: {{ post.title | jsonify }},
      date: {{ post.date | date: "%d %B %Y" | jsonify }},
      url: {{ post.url | relative_url | jsonify }},
      image: {{ post.image | prepend: site.baseurl | jsonify }},
      image_alt: {{ post.image_alt | default: post.title | jsonify }},
      sites: {{ post.sites | jsonify | default: "[]" }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  // Save the site's base URL before using "site" for individual site records.
  {% assign site_baseurl = site.baseurl %}

  // Add site placemarks from _data/sites.yml
  const sites = [
    {% for site in site.data.sites %}
    {
      name: {{ site.name | jsonify }},
      latitude: {{ site.latitude | jsonify }},
      longitude: {{ site.longitude | jsonify }},
      description: {{ site.description | jsonify }},
      image: {% if site.image %}{{ site.image | prepend: site_baseurl | jsonify }}{% else %}null{% endif %},
      image_alt: {{ site.image_alt | default: site.name | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  sites.forEach(function (site) {
    const marker = L.marker([site.latitude, site.longitude])
      .addTo(butterflyMap);

    const popup = document.createElement("div");

    const heading = document.createElement("strong");
    heading.textContent = site.name;
    popup.appendChild(heading);

    const description = document.createElement("p");
    description.textContent = site.description || "";
    popup.appendChild(description);

    // Find posts that include this site.
    const matchingPosts = posts
      .map(function (post) {
        const siteRecord = (post.sites || []).find(function (entry) {
          return entry.name === site.name;
        });

        return siteRecord
          ? { post: post, siteRecord: siteRecord }
          : null;
      })
      .filter(Boolean);

    matchingPosts.forEach(function (item) {
      const article = document.createElement("div");
      article.style.marginTop = "10px";

      // Prefer the site's custom image; otherwise use the post image.
      const thumbnailImage = site.image || item.post.image;

      if (thumbnailImage) {
        const imageLink = document.createElement("a");
        imageLink.href = item.post.url;

        const thumbnail = document.createElement("img");
        thumbnail.src = thumbnailImage;
        thumbnail.alt = site.image
          ? (site.image_alt || site.name)
          : (item.post.image_alt || item.post.title);

        thumbnail.style.display = "block";
        thumbnail.style.width = "100%";
        thumbnail.style.maxHeight = "100px";
        thumbnail.style.objectFit = "cover";
        thumbnail.style.borderRadius = "4px";
        thumbnail.style.marginBottom = "6px";

        imageLink.appendChild(thumbnail);
        article.appendChild(imageLink);
      }

      // Journal post link.
      const link = document.createElement("a");
      link.href = item.post.url;
      link.textContent = item.post.title;
      article.appendChild(link);

      // Post date.
      const date = document.createElement("div");
      date.textContent = item.post.date;
      article.appendChild(date);

      // Species recorded at this particular site.
      const species = item.siteRecord.species || [];

      if (species.length > 0) {
        const label = document.createElement("strong");
        label.textContent = "Species recorded";
        label.style.display = "block";
        label.style.marginTop = "5px";
        article.appendChild(label);

        const list = document.createElement("ul");
        list.style.margin = "4px 0";
        list.style.paddingLeft = "20px";

        species.forEach(function (name) {
          const entry = document.createElement("li");
          entry.textContent = name;
          list.appendChild(entry);
        });

        article.appendChild(list);
      }

      popup.appendChild(article);
    });

    if (matchingPosts.length === 0) {
      const message = document.createElement("p");
      message.textContent = "No linked journal posts yet.";
      popup.appendChild(message);
    }

    // Keep popups compact on mobile.
    marker.bindPopup(popup, {
      maxWidth: window.matchMedia("(max-width: 600px)").matches ? 220 : 320,
      maxHeight: window.matchMedia("(max-width: 600px)").matches ? 250 : 400
    });
  });
</script>
