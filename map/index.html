<h1 class="page-title">Explore the map</h1>

<p>
  Explore satellite imagery with roads, place names and mapped footpaths,
  bridleways and tracks. Zoom in to load path details.
</p>

<div id="path-status" style="margin: 8px 0; font-size: 14px;">
  Footpath overlay: waiting for map…
</div>

<div id="butterfly-map" style="height: 700px; width: 100%;"></div>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script src="https://unpkg.com/osmtogeojson@3.0.0/osmtogeojson.js"></script>

<script>
  const butterflyMap = L.map("butterfly-map").setView(
    [54.5, -3.0],
    5
  );

  const pathStatus = document.getElementById("path-status");

  // Esri satellite imagery
  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
    }
  );

  // Roads and transport features
  const roadsOverlay = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "Esri, HERE, Garmin, OpenStreetMap contributors"
    }
  );

  // Place names and boundaries
  const placesOverlay = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Sources: Esri, Garmin, HERE, OpenStreetMap contributors, and the GIS user community"
    }
  );

  // OpenStreetMap street map
  const streets = L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }
  );

  // Transparent paths and tracks overlay
  const pathOverlay = L.geoJSON(null, {
    style: function (feature) {
      const tags = feature.properties.tags || {};
      const highway = tags.highway;

      let color = "#ffd447";

      if (highway === "bridleway") color = "#f08a9b";
      if (highway === "track") color = "#65d6a0";
      if (highway === "cycleway") color = "#55baff";
      if (highway === "steps") color = "#ffffff";

      return {
        color: color,
        weight: 3,
        opacity: 0.95,
        lineCap: "round",
        lineJoin: "round"
      };
    }
  });

  // Default map layers
  satellite.addTo(butterflyMap);
  roadsOverlay.addTo(butterflyMap);
  placesOverlay.addTo(butterflyMap);
  pathOverlay.addTo(butterflyMap);

  // Layer selector
  L.control.layers(
    {
      "Satellite imagery": satellite,
      "Street map": streets
    },
    {
      "Roads": roadsOverlay,
      "Place names and boundaries": placesOverlay,
      "Footpaths and tracks": pathOverlay
    },
    {
      collapsed: false
    }
  ).addTo(butterflyMap);

  // Scale bar
  L.control.scale({
    imperial: false
  }).addTo(butterflyMap);

  // Path-loading state
  let pathLoadTimer = null;
  let currentRequest = null;
  let requestNumber = 0;

  function loadPaths() {
    if (!butterflyMap.hasLayer(pathOverlay)) {
      pathStatus.textContent = "Footpath overlay: switched off.";
      return;
    }

    if (butterflyMap.getZoom() < 12) {
      pathOverlay.clearLayers();
      pathStatus.textContent =
        "Footpath overlay: zoom in to level 12 or closer.";
      return;
    }

    const bounds = butterflyMap.getBounds();

    const south = bounds.getSouth();
    const west = bounds.getWest();
    const north = bounds.getNorth();
    const east = bounds.getEast();

    // Avoid querying a large area at once.
    if ((north - south) * (east - west) > 1.5) {
      pathStatus.textContent =
        "Footpath overlay: zoom in further to load a smaller area.";
      return;
    }

    const query =
      '[out:json][timeout:20];' +
      'way["highway"~"^(path|footway|bridleway|cycleway|steps|track)$"]' +
      '(' + south + ',' + west + ',' + north + ',' + east + ');' +
      'out geom;';

    if (currentRequest) {
      currentRequest.abort();
    }

    const controller = new AbortController();
    currentRequest = controller;

    const thisRequest = ++requestNumber;

    pathStatus.textContent =
      "Footpath overlay: requesting path data…";

    fetch("https://overpass-api.de/api/interpreter", {
      method: "POST",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded;charset=UTF-8"
      },
      body: "data=" + encodeURIComponent(query),
      signal: controller.signal
    })
      .then(function (response) {
        if (!response.ok) {
          throw new Error(
            "Overpass returned HTTP " + response.status
          );
        }

        return response.json();
      })
      .then(function (data) {
        if (thisRequest !== requestNumber) return;
        if (!butterflyMap.hasLayer(pathOverlay)) return;

        if (typeof osmtogeojson !== "function") {
          throw new Error(
            "The OSM-to-GeoJSON conversion script did not load."
          );
        }

        const geojson = osmtogeojson(data);

        pathOverlay.clearLayers();
        pathOverlay.addData(geojson);

        const count = pathOverlay.getLayers().length;

        pathStatus.textContent =
          "Footpath overlay: loaded " + count +
          " mapped features.";
      })
      .catch(function (error) {
        if (error.name === "AbortError") return;
        if (thisRequest !== requestNumber) return;

        pathStatus.textContent =
          "Footpath overlay error: " + error.message;

        console.error("Footpath overlay error:", error);
      })
      .finally(function () {
        if (thisRequest === requestNumber) {
          currentRequest = null;
        }
      });
  }

  function schedulePathLoad() {
    clearTimeout(pathLoadTimer);
    pathLoadTimer = setTimeout(loadPaths, 1000);
  }

  // Load paths after the user moves or zooms the map.
  butterflyMap.on("moveend", schedulePathLoad);

  // Reload when the path overlay is switched on.
  butterflyMap.on("overlayadd", function (event) {
    if (event.layer === pathOverlay) {
      schedulePathLoad();
    }
  });

  // Cancel requests and clear paths when switched off.
  butterflyMap.on("overlayremove", function (event) {
    if (event.layer === pathOverlay) {
      clearTimeout(pathLoadTimer);
      requestNumber++;

      if (currentRequest) {
        currentRequest.abort();
        currentRequest = null;
      }

      pathOverlay.clearLayers();
      pathStatus.textContent =
        "Footpath overlay: switched off.";
    }
  });

  // Initial status
  pathStatus.textContent =
    "Footpath overlay: zoom in to level 12 or closer.";
</script>
