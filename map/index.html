<h1 class="page-title">Explore the map</h1>

<p>
  Explore the landscape using satellite imagery, roads, place names
  and countryside mapping.
</p>

<div id="butterfly-map"></div>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script>
  const butterflyMap = L.map("butterfly-map").setView(
    [54.5, -3.0],
    5
  );

  // Satellite imagery (Esri)
  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS user community"
    }
  );

  // Roads and transport features (Esri)
  const roadsOverlay = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Esri, HERE, Garmin, OpenStreetMap contributors"
    }
  );

  // Place names and boundaries (Esri)
  const placesOverlay = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Sources: Esri, Garmin, HERE, OpenStreetMap contributors, and the GIS user community"
    }
  );

  // OpenStreetMap street map
  const streets = L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }
  );

  // Default: satellite imagery with roads and place names.
  satellite.addTo(butterflyMap);
  roadsOverlay.addTo(butterflyMap);
  placesOverlay.addTo(butterflyMap);

  // Layer selector
  L.control.layers(
    {
      "Satellite imagery (Esri)": satellite,
      "Street map (OpenStreetMap)": streets
    },
    {
      "Roads (Esri)": roadsOverlay,
      "Place names and boundaries (Esri)": placesOverlay
    },
    {
      collapsed: false
    }
  ).addTo(butterflyMap);

  // Remember which Esri overlays the user wants enabled.
  let roadsEnabled = true;
  let placesEnabled = true;

  // Track manual overlay changes.
  butterflyMap.on("overlayadd", function (event) {
    if (event.layer === roadsOverlay) roadsEnabled = true;
    if (event.layer === placesOverlay) placesEnabled = true;
  });

  butterflyMap.on("overlayremove", function (event) {
    if (event.layer === roadsOverlay) roadsEnabled = false;
    if (event.layer === placesOverlay) placesEnabled = false;
  });

  // Switching to OpenStreetMap removes the Esri overlays.
  butterflyMap.on("baselayerchange", function (event) {
    if (event.layer === streets) {
      butterflyMap.removeLayer(roadsOverlay);
      butterflyMap.removeLayer(placesOverlay);
    }

    // Switching back to satellite restores the selected overlays.
    if (event.layer === satellite) {
      if (roadsEnabled) roadsOverlay.addTo(butterflyMap);
      if (placesEnabled) placesOverlay.addTo(butterflyMap);
    }
  });

  // Metric scale bar
  L.control.scale({
    imperial: false
  }).addTo(butterflyMap);
</script>
